<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>МоєСтадо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./md3-add.css">
  <link rel="stylesheet" href="./md3-app.css">
</head>
<body class="app-farmer md3">
  <div id="sr-live" class="visually-hidden" aria-live="polite"></div>

  <!-- Мінімалістичний перемикач поза межами iPhone -->
  <nav class="studio-bar" aria-label="Перемикання додатків">
    <a class="studio-link active" href="./moe-stado.html">МоєСтадо</a>
    <a class="studio-link" href="./cyberfarm.html">CyberFarm</a>
    <a class="studio-link" href="./cyberfarm-web.html">CyberFarm Web</a>
  </nav>

  <!-- Фізичний корпус iPhone -->
  <div class="iphone-device android-device">
    <div class="iphone-screen" id="iphone-screen">
      <!-- Android status bar -->
      <div class="ios-statusbar m3-statusbar" aria-hidden="true">
        <span class="ios-time">9:41</span>
        <div class="punch-hole"></div>
        <div class="ios-status-icons">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8 3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4 2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>

      <!-- iOS Top Notification Banner -->
      <div id="ios-banner" class="ios-banner" role="status">
        <p class="ios-banner-title"></p>
        <p class="ios-banner-sub"></p>
      </div>

      <!-- Мінімалістичний iOS Launch Screen — зникає автоматично через 3 секунди -->
      <div id="splash-screen" class="ios-splash-screen" aria-label="Завантаження МоєСтадо">
        <div class="ios-splash-center">
          <img
            class="ios-splash-logo"
            src="./images/osl-logo.png"
            alt="МоєСтадо"
            width="112"
            height="112"
            fetchpriority="high"
          >
        </div>
      </div>

      <!-- Головна оболонка додатку (Material 3) -->
      <div id="main-app" class="m3 m3-app" inert>
        <!-- ВКЛАДКА 1: СТАДО -->
        <main id="view-herd" class="m3-view" aria-label="Стадо">
          <div class="m3-scroll">
            <search class="m3-search">
              <form id="search-form" action="#" role="search">
                <label class="m3-search-bar">
                  <span class="m3-search-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
                  <span class="sr-only">Пошук вівці</span>
                  <input type="search" id="herd-q" name="q" placeholder="Пошук вівці" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                </label>
              </form>
            </search>
            <ul class="m3-rows" id="herd-list"></ul>
          </div>
        </main>

        <!-- ВКЛАДКА 2: ПЕРЕВІРКА -->
        <section id="view-verify" class="m3-view" hidden aria-labelledby="verify-title">
          <header class="m3-appbar"><h1 class="m3-appbar-title" id="verify-title">Перевірка</h1></header>
          <div class="m3-scroll">
            <h2 class="m3-section">Очікують верифікації</h2>
            <div class="m3-cards" id="pending-verify-list"></div>
            <h2 class="m3-section">Журнал подій</h2>
            <ul class="m3-rows" id="events-list"></ul>
          </div>
        </section>

        <!-- ВКЛАДКА 3: ГОСПОДАРСТВО -->
        <section id="view-profile" class="m3-view" hidden aria-labelledby="profile-title">
          <header class="m3-appbar"><h1 class="m3-appbar-title" id="profile-title">Господарство</h1></header>
          <div class="m3-scroll">
            <div class="m3-form-block">
              <div class="m3-field">
                <select id="farmer-switcher"></select>
                <label for="farmer-switcher">Профіль фермера</label>
                <span class="m3-trailing"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></span>
              </div>
            </div>

            <h2 class="m3-section">Реквізити</h2>
            <form id="farmer-form" class="m3-form-block" action="#">
              <div class="m3-field"><input type="text" id="f-farmname" name="FarmName" placeholder=" " autocomplete="organization"><label for="f-farmname">Назва господарства</label></div>
              <div class="m3-field"><input type="text" id="f-desc" name="Description" placeholder=" " autocomplete="name"><label for="f-desc">ПІБ</label></div>
              <div class="m3-field"><input type="text" id="f-tax" name="TaxId" placeholder=" " inputmode="numeric"><label for="f-tax">ЄДРПОУ</label></div>
              <div class="m3-field"><input type="tel" id="f-phone" name="Phone" placeholder=" " autocomplete="tel"><label for="f-phone">Телефон</label></div>
              <div class="m3-field"><input type="text" id="f-addr" name="FarmAddress" placeholder=" " autocomplete="street-address"><label for="f-addr">Локація</label></div>
              <button type="submit" class="m3-btn filled m3-block-btn" id="save-farmer-btn">Зберегти</button>
            </form>

            <h2 class="m3-section">Зручність</h2>
            <div class="m3-rows">
              <label class="m3-row" for="big-ui-switch">
                <span class="m3-row-text"><span class="m3-row-title">Великий шрифт</span></span>
                <input type="checkbox" role="switch" class="m3-switch" id="big-ui-switch">
              </label>
            </div>

            <button type="button" class="m3-btn danger m3-block-btn" id="reset-db-btn">Скинути демо-дані</button>
          </div>
        </section>

        <a class="m3-fab" id="add-fab" href="./moe-stado-add.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Додати вівцю</span></a>

        <!-- Navigation bar -->
        <nav class="m3-navbar" aria-label="Головна навігація" role="tablist">
          <button type="button" class="m3-nav-item" role="tab" data-tab="herd" aria-selected="true">
            <span class="m3-nav-pill"><svg class="ic-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z"/></svg><svg class="ic-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></span><span>Стадо</span>
          </button>
          <button type="button" class="m3-nav-item" role="tab" data-tab="verify" aria-selected="false">
            <span class="m3-nav-pill"><svg class="ic-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm7 10c0 4.52-2.98 8.69-7 9.93-4.02-1.24-7-5.41-7-9.93V6.3l7-3.11 7 3.11V11zm-11.59.59L6 13l4 4 8-8-1.41-1.42L10 14.17z"/></svg><svg class="ic-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg><span class="m3-badge" id="verify-badge" hidden>0</span></span><span>Перевірка</span>
          </button>
          <button type="button" class="m3-nav-item" role="tab" data-tab="profile" aria-selected="false">
            <span class="m3-nav-pill"><svg class="ic-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5.69l5 4.5V18h-2v-6H9v6H7v-7.81l5-4.5M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg><svg class="ic-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg></span><span>Господарство</span>
          </button>
        </nav>
      </div>

      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      'use strict';

      const Store = window.SheepSystemStore;
      const UI = window.SheepSystemUI;

      let activeFarmerCode = localStorage.getItem('ios_farmer_code') || 'FRM-00001';
      const searchInput = document.getElementById('herd-q');

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Перемикання нижнього Tab Bar
      const views = {
        herd: document.getElementById('view-herd'),
        verify: document.getElementById('view-verify'),
        profile: document.getElementById('view-profile')
      };

      document.querySelectorAll('.m3-nav-item').forEach((tabBtn) => {
        tabBtn.addEventListener('click', () => {
          const target = tabBtn.dataset.tab;
          document.querySelectorAll('.m3-nav-item').forEach((b) => {
            b.setAttribute('aria-selected', String(b === tabBtn));
          });
          Object.entries(views).forEach(([key, el]) => {
            el.hidden = key !== target;
          });
          document.getElementById('add-fab').hidden = target !== 'herd';
        });
      });

      document.getElementById('search-form').addEventListener('submit', (e) => e.preventDefault());
      searchInput.addEventListener('input', renderAll);

      function statusDotClass(status) {
        if (status === 'Verified') return 'dot-verified';
        if (status === 'Rejected') return 'dot-rejected';
        return 'dot-pending';
      }

      function renderHerd(db) {
        if (!db.Catalogs.Farmers.some((f) => f.Code === activeFarmerCode) && db.Catalogs.Farmers.length) {
          activeFarmerCode = db.Catalogs.Farmers[0].Code;
        }
        const farmer = Store.getFarmerByCode(activeFarmerCode, db);
        if (!farmer) return;

        const herd = Store.getFarmerHerdResolved(activeFarmerCode, db);
        const q = searchInput.value.trim().toLowerCase();
        const filtered = herd.filter((s) => {
          if (q && !`${s.Description} ${s.EarTagNumber} ${s.Token}`.toLowerCase().includes(q)) return false;
          return true;
        });

        const listEl = document.getElementById('herd-list');
        if (!filtered.length) {
          listEl.innerHTML = `<li class="m3-empty">Овець не знайдено</li>`;
          return;
        }

        listEl.innerHTML = filtered
          .map((s) => {
            const pLabel = Store.Enums.SheepPurpose[s.Purpose].shortLabel;
            const st =
              s.VerificationStatus === 'PendingVerification'
                ? '<span class="m3-status pending">На перевірці</span>'
                : s.VerificationStatus === 'Rejected'
                  ? '<span class="m3-status rejected">Відхилена</span>'
                  : '';
            return `
              <li>
                <a class="m3-row" href="./moe-stado-sheep.html?code=${encodeURIComponent(s.Code)}" data-sheep-link="${esc(s.Code)}">
                  <span class="m3-row-thumb"><img src="${s.FullBodyPhoto}" alt="" width="56" height="56"></span>
                  <span class="m3-row-text">
                    <span class="m3-row-title">${esc(s.Description)}</span>
                    <span class="m3-row-sub"><span class="nowrap">${esc(s.EarTagNumber)}</span> · ${esc(pLabel)}</span>
                    ${st}
                  </span>
                </a>
              </li>
            `;
          })
          .join('');
      }

      function renderVerifyAndEvents(db) {
        const pendingAll = db.Catalogs.Sheep.filter((s) => s.VerificationStatus === 'PendingVerification');
        const badge = document.getElementById('verify-badge');
        badge.hidden = pendingAll.length === 0;
        badge.textContent = String(pendingAll.length);

        const pendingEl = document.getElementById('pending-verify-list');
        if (!pendingAll.length) {
          pendingEl.innerHTML = `<div class="m3-card m3-empty">Усі вівці перевірено</div>`;
        } else {
          pendingEl.innerHTML = pendingAll
            .map((s) => `
              <article class="m3-card">
                <div class="m3-row">
                  <span class="m3-row-thumb"><img src="${s.StateCertificatePhoto}" alt="Свідоцтво ${esc(s.Description)}" width="56" height="56"></span>
                  <span class="m3-row-text">
                    <span class="m3-row-title">${esc(s.Description)}</span>
                    <span class="m3-row-sub"><span class="nowrap">${esc(s.EarTagNumber)}</span></span>
                  </span>
                </div>
                <div class="m3-card-actions">
                  <button type="button" class="m3-btn danger" data-reject="${esc(s.Code)}">Відхилити</button>
                  <button type="button" class="m3-btn filled" data-approve="${esc(s.Code)}">Підтвердити</button>
                </div>
              </article>
            `)
            .join('');
        }

        const eventsEl = document.getElementById('events-list');
        eventsEl.innerHTML = db.EventLog.slice(0, 10)
          .map((ev) => `
            <li class="m3-row">
              <span class="m3-row-text">
                <span class="m3-row-title">${esc(ev.Title)}</span>
                <span class="m3-row-sub">${esc(ev.Subtitle)}</span>
              </span>
              <span class="m3-row-end">${esc(UI.formatDate(ev.Timestamp))}</span>
            </li>
          `)
          .join('');
      }

      function renderFarmerProfile(db) {
        const switcher = document.getElementById('farmer-switcher');
        if (!db.Catalogs.Farmers.some((f) => f.Code === activeFarmerCode) && db.Catalogs.Farmers.length) {
          activeFarmerCode = db.Catalogs.Farmers[0].Code;
        }
        switcher.innerHTML = db.Catalogs.Farmers
          .map((f) => `<option value="${esc(f.Code)}" ${f.Code === activeFarmerCode ? 'selected' : ''}>${esc(f.FarmName)}</option>`)
          .join('');

        const f = Store.getFarmerByCode(activeFarmerCode, db);
        if (!f) return;
        document.getElementById('f-farmname').value = f.FarmName;
        document.getElementById('f-desc').value = f.Description;
        document.getElementById('f-tax').value = f.TaxId;
        document.getElementById('f-phone').value = f.Phone;
        document.getElementById('f-addr').value = f.FarmAddress;
      }

      function renderAll() {
        const db = Store.getState();
        renderHerd(db);
        renderVerifyAndEvents(db);
        renderFarmerProfile(db);
      }

      // Обробка кліків у списках
      document.addEventListener('click', (e) => {
        const sheepLink = e.target.closest('[data-sheep-link]');
        if (sheepLink) {
          sessionStorage.setItem('farmer_selected_sheep', sheepLink.dataset.sheepLink);
          return;
        }
        const approveBtn = e.target.closest('[data-approve]');
        if (approveBtn) {
          const s = Store.setSheepVerificationStatus(approveBtn.dataset.approve, 'Verified', 'Перевірено держреєстратором');
          if (s) UI.showBanner(`«${s.Description}» верифіковано`, 'Вівця тепер доступна у додатку «CyberFarm»');
          return;
        }
        const rejectBtn = e.target.closest('[data-reject]');
        if (rejectBtn) {
          const s = Store.setSheepVerificationStatus(rejectBtn.dataset.reject, 'Rejected', 'Нечітке фото рожевого свідоцтва.');
          if (s) UI.showBanner(`«${s.Description}» відхилено`, 'Потрібно замінити фото свідоцтва');
        }
      });

      // Перемикання господарства у шапці списку стада та в профілі
      function handleFarmSwitch(e) {
        activeFarmerCode = e.target.value;
        localStorage.setItem('ios_farmer_code', activeFarmerCode);
        renderAll();
      }

      document.getElementById('farmer-switcher').addEventListener('change', handleFarmSwitch);

      document.getElementById('farmer-form').addEventListener('submit', (e) => {
        e.preventDefault();
        Store.updateFarmerProfile(activeFarmerCode, {
          FarmName: document.getElementById('f-farmname').value.trim(),
          Description: document.getElementById('f-desc').value.trim(),
          TaxId: document.getElementById('f-tax').value.trim(),
          Phone: document.getElementById('f-phone').value.trim(),
          FarmAddress: document.getElementById('f-addr').value.trim()
        });
        UI.showBanner('Профіль збережено');
      });

      const bigUiSwitch = document.getElementById('big-ui-switch');
      bigUiSwitch.checked = UI.isBigUi();
      bigUiSwitch.addEventListener('change', () => UI.setBigUi(bigUiSwitch.checked));

      document.getElementById('reset-db-btn').addEventListener('click', () => {
        Store.resetToDemoData();
        UI.showBanner('Демо-дані відновлено');
      });

      Store.subscribe(renderAll);
      renderAll();

      // Екран завантаження (Launch Screen) — закривається по кліку
      const iphoneScreen = document.getElementById('iphone-screen');
      const splashScreen = document.getElementById('splash-screen');
      const mainApp = document.getElementById('main-app');
      const flashRaw = sessionStorage.getItem('farmer_flash_banner');

      function showPendingFlashBanner() {
        if (!flashRaw) return;
        sessionStorage.removeItem('farmer_flash_banner');
        try {
          const flash = JSON.parse(flashRaw);
          if (flash && flash.title) {
            UI.showBanner(flash.title, flash.sub || '');
          }
        } catch (_) {}
      }

      function dismissSplashScreen() {
        if (!splashScreen || splashScreen.hidden) return;
        iphoneScreen.classList.remove('is-splash-active');
        mainApp.removeAttribute('inert');
        splashScreen.classList.add('is-dismissing');

        const finishDismiss = () => {
          splashScreen.hidden = true;
          showPendingFlashBanner();
        };

        if (splashScreen.getAnimations().length === 0) {
          finishDismiss();
        } else {
          splashScreen.addEventListener('transitionend', finishDismiss, { once: true });
        }
      }

      if (flashRaw) {
        // Якщо щойно додали або видалили вівцю — одразу показуємо стадо та пуш-банер
        iphoneScreen.classList.remove('is-splash-active');
        mainApp.removeAttribute('inert');
        splashScreen.hidden = true;
        showPendingFlashBanner();
      } else {
        setTimeout(dismissSplashScreen, 3000);
      }
    })();
  </script>
</body>
</html>
