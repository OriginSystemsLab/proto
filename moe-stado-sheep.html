<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Картка вівці — МоєСтадо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./md3-add.css">
  <link rel="stylesheet" href="./md3-app.css">
</head>
<body class="app-farmer md3">
  <div id="sr-live" class="visually-hidden" aria-live="polite"></div>

  <nav class="studio-bar" aria-label="Перемикання додатків">
    <a class="studio-link active" href="./moe-stado.html">МоєСтадо</a>
    <a class="studio-link" href="./cyberfarm.html">CyberFarm</a>
    <a class="studio-link" href="./cyberfarm-web.html">CyberFarm Web</a>
  </nav>

  <div class="iphone-device">
    <div class="iphone-screen">
      <!-- iOS Status Bar + Dynamic Island -->
      <div class="ios-statusbar" aria-hidden="true">
        <span class="ios-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="ios-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
            <rect x="0" y="7" width="3" height="4" rx="1"/>
            <rect x="4.5" y="5" width="3" height="6" rx="1"/>
            <rect x="9" y="2.5" width="3" height="8.5" rx="1"/>
            <rect x="13.5" y="0" width="3" height="11" rx="1"/>
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
            <path d="M7.5 10.8a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6Zm-3.3-3a4.7 4.7 0 0 1 6.6 0l1.2-1.2a6.4 6.4 0 0 0-9 0l1.2 1.2Zm-2.6-2.6a8.3 8.3 0 0 1 11.8 0L14.6 4A10 10 0 0 0 .4 4l1.2 1.2Z"/>
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/>
            <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/>
            <path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" fill-opacity="0.4"/>
          </svg>
        </div>
      </div>

      <!-- iOS Push Banner -->
      <div id="ios-banner" class="ios-banner" role="status">
        <p class="ios-banner-title"></p>
        <p class="ios-banner-sub"></p>
      </div>

      <!-- Картка вівці (Material 3) -->
      <div class="m3 m3-app m3-sheep">
        <header class="m3-appbar has-nav" id="appbar">
          <a class="m3-icon-btn" href="./moe-stado.html" aria-label="Назад до стада">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </a>
          <h1 class="m3-appbar-title" id="page-title">Вівця</h1>
        </header>
        <main class="m3-scroll" id="page-content"></main>
      </div>

      <!-- Діалог видалення вівці -->
      <dialog id="delete-reason-dialog" class="m3-dialog m3" closedby="any" aria-labelledby="delete-sheet-title">
        <form method="dialog" id="delete-form">
          <h2 id="delete-sheet-title">Видалити вівцю?</h2>
          <p class="m3-dialog-text">Оберіть причину списання зі стада.</p>
          <label class="m3-radio-row"><input type="radio" name="reason" value="Помилково додали" checked> Помилково додали</label>
          <label class="m3-radio-row"><input type="radio" name="reason" value="Пустили на мʼясо"> Пустили на мʼясо</label>
          <label class="m3-radio-row"><input type="radio" name="reason" value="Нещасний випадок"> Нещасний випадок</label>
          <div class="m3-dialog-actions">
            <button type="submit" class="m3-btn text" value="cancel" autofocus>Скасувати</button>
            <button type="submit" class="m3-btn text danger-text" value="delete">Видалити</button>
          </div>
        </form>
      </dialog>

      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      'use strict';

      const Store = window.SheepSystemStore;
      const UI = window.SheepSystemUI;

      const params = new URLSearchParams(location.search);
      const sheepCode = params.get('code') || sessionStorage.getItem('farmer_selected_sheep') || 'SHP-00101';

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function statusPillHtml(status) {
        if (status === 'Verified') return '<span class="m3-status verified">Верифікована</span>';
        if (status === 'Rejected') return '<span class="m3-status rejected">Відхилена</span>';
        return '<span class="m3-status pending">На перевірці</span>';
      }
      const row = (label, value, cls = '') => `
        <li class="m3-row"><span class="m3-row-text">
          <span class="m3-row-label">${label}</span>
          <span class="m3-row-value ${cls}">${value}</span>
        </span></li>`;

      function render() {
        const db = Store.getState();
        const s = Store.getSheepByCode(sheepCode, db) || db.Catalogs.Sheep[0];
        if (!s) return;

        const farmer = Store.getFarmerByCode(s.Farmer, db);
        document.title = `${s.Description} — МоєСтадо`;
        document.getElementById('page-title').textContent = s.Description;

        const content = document.getElementById('page-content');
        content.innerHTML = `
          <div class="m3-carousel" aria-label="Фото вівці">
            <figure class="m3-slide">
              <img src="${s.FullBodyPhoto}" alt="У повний зріст — ${esc(s.Description)}">
              <figcaption>Збоку</figcaption>
            </figure>
            <figure class="m3-slide">
              <img src="${s.EarTagPhoto}" alt="Вушна бирка ${esc(s.EarTagNumber)}">
              <figcaption>Бирка</figcaption>
            </figure>
            <figure class="m3-slide">
              <img src="${s.StateCertificatePhoto}" alt="Державне свідоцтво">
              <figcaption>Свідоцтво</figcaption>
            </figure>
          </div>

          <div class="m3-sheep-head">${statusPillHtml(s.VerificationStatus)}</div>

          ${s.VerificationStatus === 'Rejected' && s.VerificationComment ? `
            <div class="m3-alert">
              <p>${esc(s.VerificationComment)}</p>
              <button type="button" class="m3-btn" id="resubmit-cert-btn">Замінити свідоцтво</button>
            </div>
          ` : ''}

          <h2 class="m3-section">Цифровий паспорт</h2>
          <ul class="m3-rows">
            ${row('Кличка', esc(s.Description))}
            ${row('Номер бирки', esc(s.EarTagNumber))}
            ${row('GPS-маячок', s.GpsTrackerId ? esc(s.GpsTrackerId) : 'Не підключено', s.GpsTrackerId ? 'ok' : '')}
            ${row('Господарство', farmer ? esc(farmer.FarmName) : '—')}
            ${row('Зареєстровано', esc(UI.formatDate(s.RegistrationDate)))}
            ${row('Токен', esc(s.Token), 'mono')}
          </ul>

          <div class="m3-field" style="margin-block-start:24px">
            <select id="detail-purpose" name="purpose">
              <option value="ForBreeding" ${s.Purpose === 'ForBreeding' ? 'selected' : ''}>На розмноження</option>
              <option value="ForMeat" ${s.Purpose === 'ForMeat' ? 'selected' : ''}>На м'ясо</option>
            </select>
            <label for="detail-purpose">Призначення</label>
            <span class="m3-trailing"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></span>
          </div>

          <button type="button" class="m3-btn danger m3-block-btn" id="delete-sheep-btn" style="margin-block-start:24px">Видалити вівцю</button>
        `;

        content.querySelector('#delete-sheep-btn').addEventListener('click', () => {
          const dlg = document.getElementById('delete-reason-dialog');
          if (dlg) dlg.showModal();
        });

        content.querySelector('#detail-purpose').addEventListener('change', (e) => {
          const next = e.target.value;
          Store.updateSheepPurpose(s.Code, next);
          UI.showBanner('Призначення оновлено', `${s.Description} → ${Store.Enums.SheepPurpose[next].label}`);
        });

        const resub = content.querySelector('#resubmit-cert-btn');
        if (resub) {
          resub.addEventListener('click', () => {
            const cleanCert = Store.generateStateCertificatePhoto(
              s.EarTagNumber,
              s.Description,
              farmer ? farmer.FarmName : 'Господарство',
              new Date().toISOString().slice(0, 10),
              false
            );
            Store.resubmitSheepPhotos(s.Code, { stateCertificatePhoto: cleanCert });
            UI.showBanner('Повторно надіслано', `Картка «${s.Description}» на перевірці`);
          });
        }
      }

      const deleteDialog = document.getElementById('delete-reason-dialog');
      if (deleteDialog) {
        if (!('closedBy' in HTMLDialogElement.prototype)) {
          const outside = (e, dialog) => {
            const r = dialog.getBoundingClientRect();
            return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
          };
          let pressedOutside = false;
          deleteDialog.addEventListener('pointerdown', (e) => {
            pressedOutside = outside(e, deleteDialog);
          });
          deleteDialog.addEventListener('pointerup', (e) => {
            if (pressedOutside && outside(e, deleteDialog)) deleteDialog.close();
          });
        }

        deleteDialog.addEventListener('close', () => {
          const action = deleteDialog.returnValue;
          deleteDialog.returnValue = '';
          if (action !== 'delete') return;
          const picked = deleteDialog.querySelector('input[name="reason"]:checked');
          const reason = picked ? picked.value : 'Помилково додали';

          const db = Store.getState();
          const s = Store.getSheepByCode(sheepCode, db) || db.Catalogs.Sheep[0];
          if (!s) return;

          const removed = Store.deleteSheep(s.Code, reason);
          if (removed) {
            sessionStorage.setItem(
              'farmer_flash_banner',
              JSON.stringify({
                title: `«${removed.Description}» видалено`,
                sub: `Причина: ${reason}`
              })
            );
            location.href = './moe-stado.html';
          }
        });
      }

      const scroller = document.getElementById('page-content');
      scroller.addEventListener('scroll', () => {
        document.getElementById('appbar').classList.toggle('scrolled', scroller.scrollTop > 4);
      }, { passive: true });

      Store.subscribe(render);
      render();
    })();
  </script>
</body>
</html>
