<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Нова вівця — МоєСтадо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./md3-add.css">
</head>
<body class="app-farmer md3">
  <div id="sr-live" class="visually-hidden" aria-live="polite"></div>

  <nav class="studio-bar" aria-label="Перемикання додатків">
    <a class="studio-link active" href="./moe-stado.html">МоєСтадо</a>
    <a class="studio-link" href="./cyberfarm.html">CyberFarm</a>
    <a class="studio-link" href="./cyberfarm-web.html">CyberFarm Web</a>
  </nav>

  <div class="iphone-device">
    <div class="iphone-screen">
      <div class="ios-statusbar" aria-hidden="true">
        <span class="ios-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="ios-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/></svg>
        </div>
      </div>

      <!-- ===== Material 3: повноекранний діалог «Нова вівця» ===== -->
      <div class="m3">
        <header class="m3-hero">
          <div class="m3-hero-top">
            <a class="m3-icon-btn on-hero" id="close-btn" href="./moe-stado.html" aria-label="Закрити без збереження">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </a>
            <span class="m3-hero-count" id="step-counter">Крок 1 з 5</span>
          </div>
          <div class="m3-hero-main">
            <div class="m3-hero-text">
              <h2 class="m3-hero-title" id="hero-title" tabindex="-1">Як звати вівцю?</h2>
              <p class="m3-hero-lead" id="hero-lead"></p>
            </div>
          </div>
          <div class="m3-progress" role="progressbar" aria-labelledby="step-counter" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
            <span id="progress-fill"></span>
          </div>
        </header>

        <form class="m3-form" id="wizard" action="#" novalidate aria-label="Нова вівця">
          <div class="m3-body" id="wizard-body">

            <!-- КРОК 1: кличка -->
            <section class="m3-step" data-title="Як звати вівцю?" data-lead="Кличка, за якою ви її впізнаєте." data-step="1">
                                          <div class="m3-field" id="field-name">
                <input type="text" id="in-name" placeholder="Напр., Говерла" autocomplete="off" enterkeyhint="next" aria-describedby="name-support" required>
                <label for="in-name">Кличка</label>
                <p class="m3-support" id="name-support">Обов'язкове поле</p>
              </div>
            </section>

            <!-- КРОК 2: вухо з биркою -->
            <section class="m3-step" data-title="Бирка на вусі" data-lead="Номер бирки розпізнається з фото." data-step="2" hidden>
                                                        <div class="m3-photo-card">
                <div class="m3-photo-frame" data-frame="ear">
                  <svg class="m3-guide" viewBox="0 0 280 250" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M38 58 C88 24, 188 22, 250 66 C268 79, 268 103, 248 117 C198 150, 114 152, 38 124"/>
                    <path d="M131 102 Q131 92 148 92 Q165 92 165 102 L169 126 L196 150 Q200 154 200 160 L200 222 Q200 232 190 232 L106 232 Q96 232 96 222 L96 160 Q96 154 100 150 L127 126 Z"/>
                    <path d="M114 174 H182 M114 194 H182 M126 212 H170" stroke-width="2.4"/>
                  </svg>
                  <img alt="Фото вуха з биркою" data-img="ear" hidden>
                  <span class="m3-photo-status" data-status="ear" hidden>
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Фото додано
                  </span>
                </div>
                <div class="m3-photo-actions">
                  <button type="button" class="m3-btn tonal" data-shoot="ear" data-demo="ear">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
                    <span>Сфотографувати</span>
                  </button>
                </div>
              </div>
              <h3 class="m3-subhead">Розпізнаний номер</h3>
              <div class="m3-field has-trailing" id="field-tag">
                <input type="text" id="in-tag" placeholder="UA-2600501234" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" aria-describedby="tag-support">
                <label for="in-tag">Номер бирки</label>
                <span class="m3-trailing" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M7 3H4v3H2V1h5v2zm15 3V1h-5v2h3v3h2zM7 21H4v-3H2v5h5v-2zm13-3v3h-3v2h5v-5h-2zM17 6H7v12h10V6zm2 12c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2v12zM15 8H9v2h6V8zm0 3H9v2h6v-2zm0 3H9v2h6v-2z"/></svg>
                </span>
                <p class="m3-support" id="tag-support">Номер з’явиться після фото. Можна ввести вручну.</p>
              </div>
            </section>

            <!-- КРОК 3: у повний зріст -->
            <section class="m3-step" data-title="Вівця збоку" data-lead="Збоку, на весь зріст." data-step="3" hidden>
                                          <div class="m3-photo-card">
                <div class="m3-photo-frame" data-frame="body">
                  <svg class="m3-guide" viewBox="0 0 280 210" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M74 134 C58 130, 52 112, 60 98 C56 82, 68 66, 86 66 C98 52, 124 50, 140 60 C158 50, 184 56, 194 72 C206 66, 224 68, 232 78 C240 88, 232 100, 218 102 C214 118, 200 130, 184 134 L184 168 M164 136 L164 168 M104 136 L104 168 M84 134 L84 168"/>
                  </svg>
                  <img alt="Фото вівці у повний зріст" data-img="body" hidden>
                  <span class="m3-photo-status" data-status="body" hidden>
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Фото додано
                  </span>
                </div>
                <div class="m3-photo-actions">
                  <button type="button" class="m3-btn tonal" data-shoot="body" data-demo="body">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
                    <span>Сфотографувати</span>
                  </button>
                </div>
              </div>
            </section>

            <!-- КРОК 4: рожеве свідоцтво -->
            <section class="m3-step" data-title="Свідоцтво" data-lead="Потрібне для верифікації вівці." data-step="4" hidden>
                                          <div class="m3-photo-card">
                <div class="m3-photo-frame" data-frame="cert">
                  <svg class="m3-guide" viewBox="0 0 240 280" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" aria-hidden="true" style="inline-size:44%;">
                    <rect x="28" y="16" width="184" height="248" rx="14"/>
                    <path d="M58 62 H182 M58 94 H182 M58 126 H156 M58 158 H172" stroke-width="2.4"/>
                    <circle cx="158" cy="212" r="22" stroke-width="2.4"/>
                  </svg>
                  <img alt="Фото рожевого свідоцтва" data-img="cert" hidden>
                  <span class="m3-photo-status" data-status="cert" hidden>
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Фото додано
                  </span>
                </div>
                <div class="m3-photo-actions">
                  <button type="button" class="m3-btn tonal" data-shoot="cert" data-demo="cert">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
                    <span>Сфотографувати</span>
                  </button>
                </div>
              </div>
            </section>

            <!-- КРОК 5: перевірка -->
            <section class="m3-step" data-title="Перевірте дані" data-lead="Виправте й оберіть призначення." data-step="5" hidden>
                            
              <div class="m3-field" id="field-name-2">
                <input type="text" id="in-name-2" placeholder="Напр., Говерла" autocomplete="off" required aria-describedby="name2-support">
                <label for="in-name-2">Кличка</label>
                <p class="m3-support" id="name2-support" hidden></p>
              </div>
              <div class="m3-field">
                <input type="text" id="in-tag-2" placeholder="UA-2600501234" autocomplete="off" autocapitalize="characters" spellcheck="false">
                <label for="in-tag-2">Номер бирки</label>
              </div>
              <div class="m3-field">
                <select id="in-purpose">
                  <option value="ForBreeding" selected>На розмноження</option>
                  <option value="ForMeat">На м'ясо</option>
                </select>
                <label for="in-purpose">Призначення</label>
                <span class="m3-trailing" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M7 10l5 5 5-5z"/></svg>
                </span>
              </div>

              <h3 class="m3-subhead">Фотографії</h3>
              <ul class="m3-photo-grid" id="photo-list"></ul>

              <h3 class="m3-subhead">GPS-маячок</h3>
              <div class="m3-field">
                <input type="text" id="in-gps" placeholder="GPS-UA-0000" autocomplete="off" autocapitalize="characters" spellcheck="false">
                <label for="in-gps">ID маячка (необов'язково)</label>
              </div>
              <div class="m3-gps-row">
                <button type="button" class="m3-btn tonal" id="gps-find-btn">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
                  <span>Знайти поруч</span>
                </button>
                <span class="m3-chip" id="gps-chip">Не підключено</span>
              </div>
            </section>
          </div>

          <div class="m3-actions">
            <button type="button" class="m3-btn text" id="back-btn" hidden>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
              Назад
            </button>
            <span class="m3-actions-spacer"></span>
            <button type="submit" class="m3-btn filled" id="next-btn">
              <span id="next-label">Далі</span>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="next-icon"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      'use strict';

      const Store = window.SheepSystemStore;
      const UI = window.SheepSystemUI;
      const farmerCode = localStorage.getItem('ios_farmer_code') || 'FRM-00001';
      const TOTAL = 5;
      let step = 1;
      const photos = { ear: '', body: '', cert: '' };

      const $ = (id) => document.getElementById(id);
      const steps = Array.from(document.querySelectorAll('.m3-step'));
      const nameIn = $('in-name');
      const name2In = $('in-name-2');
      const tagIn = $('in-tag');
      const tag2In = $('in-tag-2');
      const gpsIn = $('in-gps');
      const body = $('wizard-body');

      const ico = (d) => `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${d}"/></svg>`;
      const HERO_ICONS = {
        1: ico('M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z'),
        2: ico('M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z'),
        3: ico('M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'),
        4: ico('M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z'),
        5: ico('M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z')
      };
      const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const randomTag = () => 'UA-' + Math.floor(2600500000 + Math.random() * 899999);
      const randomGps = () => 'GPS-UA-' + Math.floor(1000 + Math.random() * 8999);

      function setNameError(field, input, support, msg) {
        field.classList.toggle('error', !!msg);
        if (msg) {
          support.hidden = false;
          support.textContent = msg;
          input.setAttribute('aria-invalid', 'true');
          input.focus();
        } else {
          input.removeAttribute('aria-invalid');
          if (support.id === 'name-support') support.textContent = "Обов'язкове поле";
          else support.hidden = true;
        }
      }

      function setPhoto(key, src) {
        photos[key] = src;
        const img = document.querySelector(`[data-img="${key}"]`);
        const frame = document.querySelector(`[data-frame="${key}"]`);
        const status = document.querySelector(`[data-status="${key}"]`);
        const shootLabel = document.querySelector(`[data-shoot="${key}"] span`);
        img.hidden = !src;
        if (src) img.src = src; else img.removeAttribute('src');
        frame.classList.toggle('has-photo', !!src);
        status.hidden = !src;
        shootLabel.textContent = src ? 'Перезняти' : 'Сфотографувати';
        if (key === 'ear' && src && !tagIn.value.trim()) {
          tagIn.value = randomTag();
          tag2In.value = tagIn.value;
          const sup = $('tag-support');
          sup.textContent = '✓ Номер розпізнано з фото. Перевірте його.';
          sup.classList.add('ok');
        }
        if (key === 'ear' && src) {
          requestAnimationFrame(() => $('field-tag').scrollIntoView({ behavior: 'smooth', block: 'center' }));
        }
      }

      function renderPhotoList() {
        const rows = [
          { key: 'ear', label: 'Бирка', step: 2 },
          { key: 'body', label: 'Збоку', step: 3 },
          { key: 'cert', label: 'Свідоцтво', step: 4 }
        ];
        $('photo-list').innerHTML = rows.map((r) => {
          const has = !!photos[r.key];
          return `
            <li>
              <button type="button" class="m3-photo-tile${has ? ' has' : ''}" data-goto="${r.step}" aria-label="${esc(r.label)}: ${has ? 'змінити фото' : 'додати фото'}">
                <span class="m3-photo-tile-img">${has
                  ? `<img src="${photos[r.key]}" alt="">`
                  : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'}
                  ${has ? '<span class="m3-photo-tile-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' : ''}
                </span>
                <span class="m3-photo-tile-label">${esc(r.label)}</span>
              </button>
            </li>`;
        }).join('');
      }

      function updateGps() {
        const chip = $('gps-chip');
        const v = gpsIn.value.trim();
        chip.classList.toggle('ok', !!v);
        chip.innerHTML = v
          ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Підключено'
          : 'Не підключено';
        $('gps-find-btn').querySelector('span').textContent = v ? 'Змінити маячок' : 'Знайти поруч';
      }

      function go(n) {
        step = Math.max(1, Math.min(TOTAL, n));
        steps.forEach((s) => { s.hidden = Number(s.dataset.step) !== step; });
        $('step-counter').textContent = `Крок ${step} з ${TOTAL}`;
        $('progress-fill').style.inlineSize = `${(step / TOTAL) * 100}%`;
        document.querySelector('.m3-progress').setAttribute('aria-valuenow', String(step));
        $('back-btn').hidden = step === 1;
        const cur = steps[step - 1];
        $('hero-title').textContent = cur.dataset.title;
        $('hero-lead').textContent = cur.dataset.lead;
        $('next-label').textContent = step === TOTAL ? 'Додати вівцю' : 'Далі';
        $('next-icon').style.display = step === TOTAL ? 'none' : '';
        if (step === TOTAL) {
          name2In.value = nameIn.value.trim();
          if (!tagIn.value.trim()) tagIn.value = randomTag();
          tag2In.value = tagIn.value.trim();
          renderPhotoList();
          updateGps();
        }
        body.scrollTop = 0;
        if (step === 1) nameIn.focus({ preventScroll: true });
        else $('hero-title').focus({ preventScroll: true });
      }

      function refreshNextLabel() { if (step >= 2 && step <= 4) go(step); }

      // Події
      nameIn.addEventListener('input', () => setNameError($('field-name'), nameIn, $('name-support'), ''));
      name2In.addEventListener('input', () => { nameIn.value = name2In.value; setNameError($('field-name-2'), name2In, $('name2-support'), ''); });
      tagIn.addEventListener('input', () => {
        tag2In.value = tagIn.value;
        const sup = $('tag-support');
        sup.textContent = 'Номер з’явиться після фото. Можна ввести вручну.';
        sup.classList.remove('ok');
      });
      tag2In.addEventListener('input', () => { tagIn.value = tag2In.value; });
      gpsIn.addEventListener('input', updateGps);
      $('gps-find-btn').addEventListener('click', () => { gpsIn.value = randomGps(); updateGps(); });

      document.querySelectorAll('[data-demo]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.demo;
          if (key === 'ear') setPhoto('ear', './images/ear-tag-demo.jpg');
          if (key === 'body') {
            const pool = ['./images/sheep-2.jpg', './images/sheep-3.jpg', './images/sheep-5.jpg'];
            setPhoto('body', pool[Math.floor(Math.random() * pool.length)]);
          }
          if (key === 'cert') {
            const farmer = Store.getFarmerByCode(farmerCode);
            if (!tagIn.value.trim()) { tagIn.value = randomTag(); tag2In.value = tagIn.value; }
            setPhoto('cert', Store.generateStateCertificatePhoto(
              tagIn.value.trim(),
              nameIn.value.trim() || 'Нова вівця',
              farmer ? farmer.FarmName : 'Господарство',
              new Date().toISOString().slice(0, 10)
            ));
          }
          refreshNextLabel();
        });
      });

      $('photo-list').addEventListener('click', (e) => {
        const b = e.target.closest('[data-goto]');
        if (b) go(Number(b.dataset.goto));
      });

      $('back-btn').addEventListener('click', () => go(step - 1));

      $('wizard').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT' && step < TOTAL) {
          e.preventDefault();
          $('wizard').requestSubmit();
        }
      });

      $('wizard').addEventListener('submit', (e) => {
        e.preventDefault();
        if (step === 1) {
          if (!nameIn.value.trim()) return setNameError($('field-name'), nameIn, $('name-support'), 'Вкажіть кличку вівці');
          return go(2);
        }
        if (step < TOTAL) return go(step + 1);

        const name = name2In.value.trim();
        if (!name) return setNameError($('field-name-2'), name2In, $('name2-support'), 'Вкажіть кличку вівці');
        $('next-btn').disabled = true;
        const created = Store.registerSheep({
          farmerCode,
          name,
          earTagNumber: tag2In.value.trim() || randomTag(),
          purpose: $('in-purpose').value,
          gpsTrackerId: gpsIn.value.trim(),
          earTagPhoto: photos.ear,
          fullBodyPhoto: photos.body,
          stateCertificatePhoto: photos.cert
        });
        sessionStorage.setItem('farmer_flash_banner', JSON.stringify({
          title: `«${created.Description}» вже у стаді`,
          sub: 'Токен створено • Передано на верифікацію'
        }));
        location.href = './moe-stado.html';
      });

      go(1);
    })();
  </script>
</body>
</html>
