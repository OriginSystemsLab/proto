<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Картка вівці — єВівця</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    /* Вікно «Розрахувати прибутковість» */
    .roi-summary { margin: 0 16px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .roi-summary-cell { background: var(--ios-card); border-radius: 14px; padding: 12px 14px; }
    .roi-summary-val { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .roi-summary-val.green { color: var(--ios-green-ink); }
    .roi-summary-lbl { margin: 2px 0 0; font-size: 12px; color: var(--ios-secondary); }
    .roi-chart-card { margin: 0 16px 20px; background: var(--ios-card); border-radius: 14px; padding: 14px 10px 8px; }
    .roi-chart-title { margin: 0 6px 8px; display: flex; justify-content: space-between; font-size: 13px; color: var(--ios-secondary); }
    .roi-chart-title strong { color: var(--ios-label); font-weight: 600; }
    .roi-chart svg { inline-size: 100%; block-size: auto; overflow: visible; }
    .roi-chart .grid { stroke: var(--ios-separator); stroke-width: 0.5; }
    .roi-chart .axis { font-size: 10px; fill: var(--ios-secondary); font-variant-numeric: tabular-nums; }
    .roi-chart .bar { fill: #34C759; opacity: 0.35; }
    .roi-chart .line { fill: none; stroke: var(--ios-green-ink); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
    .roi-chart .area { fill: url(#roiArea); }
    .roi-chart .dot { fill: var(--ios-green-ink); stroke: #fff; stroke-width: 2; }
    .roi-legend { display: flex; gap: 14px; margin: 6px 6px 2px; font-size: 11.5px; color: var(--ios-secondary); }
    .roi-legend i { display: inline-block; inline-size: 10px; block-size: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
    .roi-table { inline-size: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    .roi-table th { font-size: 12px; font-weight: 500; color: var(--ios-secondary); text-align: end; padding: 10px 16px 8px; }
    .roi-table th:first-child, .roi-table td:first-child { text-align: start; }
    .roi-table td { padding: 11px 16px; text-align: end; border-block-start: 0.5px solid var(--ios-separator); white-space: nowrap; }
    .roi-table td.green { color: var(--ios-green-ink); font-weight: 600; }
    .roi-table tfoot td { font-weight: 700; }
    .roi-note { margin: -8px 32px 20px; font-size: 12px; line-height: 1.4; color: var(--ios-secondary); }
  </style>
</head>
<body class="app-investor">
  <div id="sr-live" class="visually-hidden" aria-live="polite"></div>

  <nav class="studio-bar" aria-label="Перемикання додатків">
    <a class="studio-link" href="./moe-stado.html">МоєСтадо</a>
    <a class="studio-link active" href="./ye-vivtsia.html">єВівця</a>
  </nav>

  <div class="iphone-device">
    <div class="iphone-screen">
      <!-- iOS Status Bar + Dynamic Island -->
      <div class="ios-statusbar" aria-hidden="true">
        <span class="ios-time">9:41</span>
        <div class="dynamic-island"></div>
        <div class="ios-status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
            <rect x="0" y="7" width="3" height="4" rx="1"/>
            <rect x="4.5" y="5" width="3" height="6" rx="1"/>
            <rect x="9" y="2.5" width="3" height="8.5" rx="1"/>
            <rect x="13.5" y="0" width="3" height="11" rx="1"/>
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
            <path d="M7.5 10.8a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6Zm-3.3-3a4.7 4.7 0 0 1 6.6 0l1.2-1.2a6.4 6.4 0 0 0-9 0l1.2 1.2Zm-2.6-2.6a8.3 8.3 0 0 1 11.8 0L14.6 4A10 10 0 0 0 .4 4l1.2 1.2Z"/>
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35"/>
            <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/>
            <path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" fill-opacity="0.4"/>
          </svg>
        </div>
      </div>

      <!-- iOS Push Banner -->
      <div id="ios-banner" class="ios-banner" role="status">
        <p class="ios-banner-title"></p>
        <p class="ios-banner-sub"></p>
      </div>

      <!-- Окрема сторінка перегляду вівці в єВівця -->
      <div class="ios-app" id="main-app">
        <header class="ios-subpage-navbar">
          <a class="ios-back-link" id="back-link" href="./ye-vivtsia.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
              <path d="m15 19-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="back-label">Інвестувати</span>
          </a>
          <h1 id="page-title">Вівця</h1>
          <div class="ios-subpage-end" id="page-badge"></div>
        </header>

        <main class="ios-scroll" id="page-content" style="padding-block: 14px 40px;"></main>
      </div>

      <!-- Нове вікно: Розрахунок прибутковості -->
      <div id="sheet-roi" class="ios-sheet-layer" hidden role="dialog" aria-modal="true" aria-labelledby="roi-title">
        <div class="ios-sheet">
          <div class="ios-sheet-grabber"></div>
          <div class="ios-sheet-header">
            <span></span>
            <h2 id="roi-title">Прибутковість</h2>
            <button type="button" class="ios-nav-btn semibold end-action" id="roi-close-btn">Готово</button>
          </div>
          <div class="ios-sheet-body" id="roi-body"></div>
        </div>
      </div>

      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      'use strict';

      const Store = window.SheepSystemStore;
      const UI = window.SheepSystemUI;

      const params = new URLSearchParams(location.search);
      const sheepCode = params.get('code') || sessionStorage.getItem('investor_selected_sheep') || 'SHP-00101';
      const fromTab = params.get('from') || sessionStorage.getItem('investor_from_tab') || 'portfolio';
      const activeInvestorCode = localStorage.getItem('ios_investor_code') || 'INV-00001';

      const backLink = document.getElementById('back-link');
      const backLabel = document.getElementById('back-label');
      if (fromTab === 'catalog') {
        backLink.href = './ye-vivtsia.html#catalog';
        backLabel.textContent = 'Інвестувати';
      } else {
        backLink.href = './ye-vivtsia.html';
        backLabel.textContent = 'Кіберферма';
      }

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function render() {
        const db = Store.getState();
        const s = Store.getSheepByCode(sheepCode, db) || db.Catalogs.Sheep[0];
        if (!s) return;

        const farmer = Store.getFarmerByCode(s.Farmer, db);
        const myTotals = Store.calculateInvestorSheepTotals(activeInvestorCode, s.Code, db);
        const pool = Store.calculateSheepTotalInvestments(s.Code, db);
        const pMeta = Store.Enums.SheepPurpose[s.Purpose];

        document.title = `${s.Description} — єВівця`;
        document.getElementById('page-title').textContent = s.Description;
        document.getElementById('page-badge').innerHTML = `<span class="ios-pill blue">${esc(pMeta.shortLabel)}</span>`;

        const content = document.getElementById('page-content');
        content.innerHTML = `
          <div class="ios-photo-carousel">
            <div class="ios-photo-slide">
              <img src="${s.FullBodyPhoto}" alt="У повний зріст — ${esc(s.Description)}" width="320" height="213">
              <div class="ios-photo-caption"><span>Повний зріст</span><span>1 / 3</span></div>
            </div>
            <div class="ios-photo-slide">
              <img src="${s.EarTagPhoto}" alt="Вушна бирка ${esc(s.EarTagNumber)}" width="320" height="213">
              <div class="ios-photo-caption"><span>Вухо з номером</span><span>2 / 3</span></div>
            </div>
            <div class="ios-photo-slide">
              <img src="${s.StateCertificatePhoto}" alt="Рожеве державне свідоцтво" width="320" height="213">
              <div class="ios-photo-caption"><span>Рожеве свідоцтво</span><span>3 / 3</span></div>
            </div>
          </div>

          ${myTotals.invested > 0 ? `
            <div class="ios-stats-card">
              <div class="ios-stat-cell" style="grid-column: span 2;">
                <p class="ios-stat-val">${UI.formatMoney(myTotals.invested)}</p>
                <p class="ios-stat-lbl">Ваша інвестиція</p>
              </div>
              <div class="ios-stat-cell">
                <p class="ios-stat-val" style="color:var(--ios-green-ink);">+${UI.formatMoney(myTotals.yieldAccrued)}</p>
                <p class="ios-stat-lbl">Дохід</p>
              </div>
            </div>
          ` : ''}

          <div class="ios-section-header">Інвестувати</div>
          <div class="ios-group" style="margin-block-end:10px;">
            <div class="ios-field-row">
              <label for="invest-amount">Сума, ₴</label>
              <input type="text" inputmode="numeric" id="invest-amount" value="10000">
            </div>
          </div>
          <div class="ios-amount-chips" id="preset-chips">
            <button type="button" class="ios-chip" data-amt="5000">5 000 ₴</button>
            <button type="button" class="ios-chip active" data-amt="10000">10 000 ₴</button>
            <button type="button" class="ios-chip" data-amt="15000">15 000 ₴</button>
          </div>
          <button type="button" class="ios-primary-btn" id="invest-btn">
            ${myTotals.invested > 0 ? 'Доінвестувати' : 'Додати у Кіберферму'}
          </button>

          <button type="button" class="ios-secondary-btn" id="roi-btn">
            Розрахувати прибутковість
          </button>

          <div class="ios-section-header">Паспорт вівці</div>
          <div class="ios-group">
            <div class="ios-row">
              <div class="ios-row-main"><p class="ios-row-title" style="font-weight:400;">Господарство</p></div>
              <span style="color:var(--ios-secondary);font-size:14px;">${farmer ? esc(farmer.FarmName) : ''}</span>
            </div>
            <div class="ios-row">
              <div class="ios-row-main"><p class="ios-row-title" style="font-weight:400;">Призначення</p></div>
              <span style="color:var(--ios-secondary);font-size:14px;">${esc(pMeta.label)}</span>
            </div>
            <div class="ios-row">
              <div class="ios-row-main"><p class="ios-row-title" style="font-weight:400;">Дохідність</p></div>
              <span style="color:var(--ios-green-ink);font-size:15px;font-weight:600;">${esc(pMeta.apr)}</span>
            </div>
            <div class="ios-row">
              <div class="ios-row-main"><p class="ios-row-title" style="font-weight:400;">Номер бирки</p></div>
              <span style="color:var(--ios-secondary);font-size:14px;">${esc(s.EarTagNumber)}</span>
            </div>
            <div class="ios-row">
              <div class="ios-row-main"><p class="ios-row-title" style="font-weight:400;">GPS-маячок</p></div>
              <span style="color:${s.GpsTrackerId ? 'var(--ios-green-ink)' : 'var(--ios-secondary)'};font-size:14px;">${s.GpsTrackerId ? esc(s.GpsTrackerId) : 'Не підключено'}</span>
            </div>
            <div class="ios-row">
              <div class="ios-row-main"><p class="ios-row-title" style="font-weight:400;">Залучено всього</p></div>
              <span style="color:var(--ios-secondary);font-size:15px;">${UI.formatMoney(pool.invested)}</span>
            </div>
            <div class="ios-row">
              <div class="ios-row-main">
                <p class="ios-row-title" style="font-weight:400;">Токен</p>
                <p class="ios-row-sub" style="font-family:ui-monospace,monospace;">${esc(s.Token)}</p>
              </div>
            </div>
          </div>
        `;

        const amtInput = content.querySelector('#invest-amount');
        content.querySelector('#preset-chips').addEventListener('click', (e) => {
          const chip = e.target.closest('[data-amt]');
          if (!chip) return;
          amtInput.value = chip.dataset.amt;
          content.querySelectorAll('.ios-chip').forEach((c) => c.classList.toggle('active', c === chip));
        });

        content.querySelector('#invest-btn').addEventListener('click', () => {
          const val = parseInt(amtInput.value.replace(/\s+/g, ''), 10);
          if (!Number.isFinite(val) || val <= 0) {
            amtInput.focus();
            return;
          }
          Store.investInSheepBatch({
            investorCode: activeInvestorCode,
            items: [{ sheepCode: s.Code, amount: val }]
          });
          UI.showBanner('Інвестицію проведено', `${s.Description} • ${UI.formatMoney(val)}`);
        });

        content.querySelector('#roi-btn').addEventListener('click', (e) => {
          const typed = parseInt(amtInput.value.replace(/\s+/g, ''), 10);
          const principal = myTotals.invested > 0 ? myTotals.invested : (Number.isFinite(typed) && typed > 0 ? typed : 10000);
          openRoi(e.currentTarget, { sheep: s, pMeta, principal, isOwned: myTotals.invested > 0 });
        });
      }

      // ---------- Розрахунок прибутковості: графік + таблиця по місяцях ----------
      const mainApp = document.getElementById('main-app');
      const sheetRoi = document.getElementById('sheet-roi');
      const roiBody = document.getElementById('roi-body');
      let roiInvoker = null;
      let roiState = null;

      function buildSchedule(principal, aprPct, months) {
        const monthly = principal * (aprPct / 100) / 12;
        const start = new Date();
        start.setDate(1);
        const rows = [];
        let total = 0;
        for (let k = 1; k <= months; k++) {
          const d = new Date(start.getFullYear(), start.getMonth() + k, 1);
          total += monthly;
          rows.push({ date: d, income: monthly, total });
        }
        return rows;
      }

      function monthLabel(d, withYear) {
        const m = new Intl.DateTimeFormat('uk-UA', { month: withYear ? 'long' : 'short' }).format(d).replace('.', '');
        const cap = m.charAt(0).toUpperCase() + m.slice(1);
        return withYear ? `${cap} ${d.getFullYear()}` : cap;
      }

      function shortMoney(n) {
        if (n >= 1000) return (n / 1000).toLocaleString('uk-UA', { maximumFractionDigits: 1 }) + 'k';
        return String(Math.round(n));
      }

      function chartSvg(rows) {
        const W = 340, H = 190, L = 36, R = 8, T = 10, B = 24;
        const iw = W - L - R, ih = H - T - B;
        const maxV = rows[rows.length - 1].total;
        const step = niceStep(maxV / 4);
        const top = Math.ceil(maxV / step) * step;
        const x = (i) => L + (iw * (i + 0.5)) / rows.length;
        const y = (v) => T + ih - (v / top) * ih;
        const bw = Math.max(2, (iw / rows.length) * 0.55);
        let grid = '';
        for (let v = 0; v <= top + 0.001; v += step) {
          grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${shortMoney(v)}</text>`;
        }
        const every = rows.length <= 12 ? 2 : rows.length <= 24 ? 4 : 6;
        const xl = rows.map((r, i) => (i % every === 0 ? `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${monthLabel(r.date, false)}</text>` : '')).join('');
        const bars = rows.map((r, i) => `<rect class="bar" x="${x(i) - bw / 2}" y="${y(r.income)}" width="${bw}" height="${T + ih - y(r.income)}" rx="1.5"><title>${monthLabel(r.date, true)}: +${UI.formatMoney(r.income)}</title></rect>`).join('');
        const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.total).toFixed(1)}`);
        const area = `M${x(0).toFixed(1)},${T + ih} L${pts.join(' L')} L${x(rows.length - 1).toFixed(1)},${T + ih} Z`;
        const last = rows.length - 1;
        return `
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Накопичений дохід за ${rows.length} міс.: до ${UI.formatMoney(maxV)}">
            <defs><linearGradient id="roiArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#34C759" stop-opacity="0.28"/><stop offset="1" stop-color="#34C759" stop-opacity="0"/></linearGradient></defs>
            ${grid}${bars}
            <path class="area" d="${area}"/>
            <polyline class="line" points="${pts.join(' ')}"/>
            <circle class="dot" cx="${x(last)}" cy="${y(rows[last].total)}" r="4"/>
            ${xl}
          </svg>`;
      }

      function niceStep(raw) {
        const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
        const n = raw / p;
        return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
      }

      function renderRoi() {
        const { sheep, pMeta, principal, isOwned, months } = roiState;
        const aprPct = parseFloat(pMeta.apr) || 0;
        const rows = buildSchedule(principal, aprPct, months);
        const total = rows[rows.length - 1].total;
        roiBody.innerHTML = `
          <div class="ios-segmented" role="tablist" aria-label="Період">
            ${[12, 24, 36].map((m) => `<button type="button" role="tab" class="ios-seg-btn" data-months="${m}" aria-selected="${m === months}">${m / 12} ${m === 12 ? 'рік' : 'роки'}</button>`).join('')}
          </div>

          <div class="roi-summary">
            <div class="roi-summary-cell">
              <p class="roi-summary-val">${UI.formatMoney(principal)}</p>
              <p class="roi-summary-lbl">${isOwned ? 'Ваша інвестиція' : 'Сума інвестиції'}</p>
            </div>
            <div class="roi-summary-cell">
              <p class="roi-summary-val green">+${UI.formatMoney(total)}</p>
              <p class="roi-summary-lbl">Дохід за ${months} міс. · ${esc(pMeta.apr)}</p>
            </div>
          </div>

          <div class="roi-chart-card">
            <p class="roi-chart-title"><span>«${esc(sheep.Description)}»</span><span>≈ <strong>+${UI.formatMoney(rows[0].income)}</strong> / міс.</span></p>
            <div class="roi-chart">${chartSvg(rows)}</div>
            <div class="roi-legend">
              <span><i style="background:#34C759;opacity:.45"></i>Дохід за місяць</span>
              <span><i style="background:var(--ios-green-ink)"></i>Накопичено</span>
            </div>
          </div>

          <div class="ios-section-header">Заробіток по місяцях</div>
          <div class="ios-group">
            <table class="roi-table">
              <thead><tr><th scope="col">Місяць</th><th scope="col">Дохід</th><th scope="col">Накопичено</th></tr></thead>
              <tbody>
                ${rows.map((r) => `<tr><td>${monthLabel(r.date, true)}</td><td class="green">+${UI.formatMoney(r.income)}</td><td>${UI.formatMoney(r.total)}</td></tr>`).join('')}
              </tbody>
              <tfoot><tr><td>Разом</td><td class="green">+${UI.formatMoney(total)}</td><td>${UI.formatMoney(principal + total)}</td></tr></tfoot>
            </table>
          </div>
          <p class="roi-note">Прогноз за ставкою ${esc(pMeta.apr)} без реінвестування. Фактичний дохід залежить від вовни, приплоду та реалізації.</p>
        `;
      }

      function openRoi(invoker, opts) {
        roiInvoker = invoker;
        roiState = { ...opts, months: 12 };
        renderRoi();
        roiBody.scrollTop = 0;
        UI.openSheet(sheetRoi, mainApp);
      }

      function closeRoi() {
        UI.closeSheet(sheetRoi, mainApp, roiInvoker);
      }

      roiBody.addEventListener('click', (e) => {
        const b = e.target.closest('[data-months]');
        if (!b) return;
        roiState.months = Number(b.dataset.months);
        renderRoi();
      });
      document.getElementById('roi-close-btn').addEventListener('click', closeRoi);
      sheetRoi.addEventListener('click', (e) => { if (e.target === sheetRoi) closeRoi(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheetRoi.hidden) closeRoi(); });

      Store.subscribe(render);
      render();
    })();
  </script>
</body>
</html>
